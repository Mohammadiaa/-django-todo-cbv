{% extends 'base.html' %} {% block content %}

<div class="card p-4 shadow-sm">
  <!-- هدر کارت، عنوان + دکمه ایجاد -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <!-- عنوان مثل یک دکمه آبی -->
    <span class="btn btn-primary btn-lg disabled"> My Tasks </span>

    <!-- دکمه ایجاد تسک جدید -->
    <a class="btn btn-success btn-lg shadow-sm" href="/task/create/">
      + New Task
    </a>
  </div>

  <!-- لیست تسک‌ها -->
  <ul class="list-group">
    {% for task in tasks %}
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <span class="task-title">
        {% if task.is_done %}
        <s>{{ task.title }}</s>
        {% else %} {{ task.title }} {% endif %}
      </span>
      <div class="btn-group" role="group">
        <a class="btn btn-sm btn-warning" href="/task/{{ task.id }}/toggle/"
          >Done</a
        >
        <a class="btn btn-sm btn-info" href="/task/{{ task.id }}/edit/">Edit</a>
        <a class="btn btn-sm btn-danger" href="/task/{{ task.id }}/delete/"
          >Delete</a
        >
      </div>
    </li>
    {% empty %}
    <li class="list-group-item text-center text-muted py-4">No tasks yet</li>
    {% endfor %}
  </ul>
</div>

{% endblock %}
