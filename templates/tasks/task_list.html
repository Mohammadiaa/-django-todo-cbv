{% extends 'base.html' %} 
{% block content %}

<div class="d-flex justify-content-between mb-3">
  <h3>My Tasks</h3>
  <a class="btn btn-success" href="/task/create/">New Task</a>
</div>

<ul class="list-group">
  {% for task in tasks %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
      {% if task.is_done %}
      <s>{{ task.title }}</s>
      {% else %} {{ task.title }} {% endif %}
    </div>
    <div>
      <a class="btn btn-sm btn-warning" href="/task/{{task.id}}/toggle/">Done</a>
      <a class="btn btn-sm btn-info" href="/task/{{task.id}}/edit/">Edit</a>
      <a class="btn btn-sm btn-danger" href="/task/{{task.id}}/delete/"
        >Delete</a
      >
    </div>
  </li>
  {% empty %}
  <li class="list-group-item">No tasks yet</li>
  {% endfor %}
</ul>
{% endblock %}
