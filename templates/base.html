{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark">
  <div class="nav-container">
    
    <!-- سمت چپ: برند -->
    <a class="navbar-brand" href="/">Todo App</a>

    <!-- سمت راست: همه چیز در یک ردیف -->
    <div style="display:flex; align-items:center; gap:15px;">
      
      <!-- بخش اطلاعات کاربر (ایمیل + آواتار) -->
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="color:#fff; font-size:14px; font-weight:500;">
          {{ user.email }}
        </span>
        <img src="{% static 'avatar.png' %}" width="38" height="38" 
             style="border-radius:50%; border:2px solid #444; object-fit:cover;">
      </div>

      <!-- دکمه‌ها -->
      <a class="btn btn-sm btn-primary" href="/profile/">Profile</a>
      <a class="btn btn-sm btn-danger" href="/logout/">Logout</a>

    </div>

  </div>
</nav>

    <div class="container mt-4">{% block content %}{% endblock %}</div>
  </body>
</html>
