{% extends 'base.html' %}
{% block content %}

<div class="edit-profile-page">
  <div class="edit-profile-card">

    <div class="edit-header">
      <img src="{{ user.profile.avatar.url }}" class="edit-avatar">
      <h2>Edit Profile</h2>
      <p>{{ user.email }}</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="edit-form">
      {% csrf_token %}

      <div class="row">
        <div class="field">
          <label>First name</label>
          {{ form.first_name }}
        </div>
        <div class="field">
          <label>Last name</label>
          {{ form.last_name }}
        </div>
      </div>

      <div class="field">
        <label>Avatar</label>
        {{ form.avatar }}
      </div>

      <div class="field">
        <label>Bio</label>
        {{ form.bio }}
      </div>

      <button class="save-btn">Save Changes</button>
    </form>

  </div>
</div>

{% endblock %}
