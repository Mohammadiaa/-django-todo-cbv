<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Todo App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Tahoma, Arial, sans-serif;
      }

      body {
        background: #2a5298;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-card {
        background: #ffffff;
        width: 90%;
        max-width: 380px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .login-card h2 {
        margin-bottom: 25px;
        color: #333;
        font-size: 24px;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .form-group {
        width: 100%;
        margin-bottom: 15px;
        text-align: left;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        color: #666;
        margin-bottom: 5px;
        padding-left: 2px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
        background: #f9f9f9;
      }

      .form-group input:focus {
        border-color: #2563eb;
        background: #fff;
        box-shadow: 0 0 5px rgba(37, 99, 235, 0.2);
      }

      .login-btn {
        width: 120px;
        padding: 12px;
        margin-top: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .errorlist {
        list-style: none;
        color: #dc2626;
        font-size: 13px;
        margin-bottom: 10px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Login</h2>

      <!-- ✅ فرم درست -->
      <form method="post">
        {% csrf_token %}

        {% if form.errors %}
          <ul class="errorlist">
            {% for field, errors in form.errors.items %}
              {% for error in errors %}
                <li>{{ error }}</li>
              {% endfor %}
            {% endfor %}
          </ul>
        {% endif %}

        <div class="form-group">
          <label for="id_username">Email</label>
          <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input
            type="password"
            name="password"
            id="id_password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="login-btn">Login</button>

        <p>
          Don't have an account?
          <a href="{% url 'accounts:register' %}">Sign Up</a>
        </p>
      </form>
    </div>
  </body>
</html>
