<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Todo App</title>
    <style>
        /* ریست کردن استایل‌های پیش‌فرض */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif; /* فونت‌های استاندارد که همه جا باز میشن */
        }

        /* کل صفحه رو فلکس می‌کنیم که کارت بیاد وسط */
        body {
            background: #1e3a8a; /* رنگ آبی مشابه تصویرت */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* کارت سفید وسط صفحه */
        .login-card {
            background: #ffffff;
            width: 90%;
            max-width: 380px; /* عرض کارت رو محدود کردیم که پهن نشه */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center; /* همه محتویات داخل کارت وسط‌چین بشن */
        }

        .login-card h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        /* استایل فرم */
        form {
            display: flex;
            flex-direction: column;
            align-items: center; /* فیلدها رو در مرکز فرم نگه می‌داره */
        }

        /* استایل هر ردیف (لیبل و اینپوت) */
        .form-group {
            width: 100%;
            margin-bottom: 15px;
            text-align: left; /* لیبل‌ها چپ‌چین باشن برای خوانایی */
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            padding-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            background: #f9f9f9;
        }

        .form-group input:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.2);
        }

        /* دکمه لاگین */
        .login-btn {
            width: 120px; /* دکمه رو جمع‌وجور کردیم */
            padding: 12px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* برای مدیریت خطاهای جنگو */
        .errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <!-- بخش Email -->
            <div class="form-group">
                <label for="id_username">Email</label>
                <input type="text" name="username" id="id_username" placeholder="Enter your email" required>
            </div>

            <!-- بخش Password -->
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required>
            </div>

            <!-- دکمه که دقیقاً میاد وسط -->
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

</body>
</html>
