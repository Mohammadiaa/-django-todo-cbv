{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
     <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-md-4">
          <div class="card p-4">
            <h4 class="mb-3">Login</h4>
            <form method="post">
              {% csrf_token %} 
              {{ form.as_p }}
              <button class="btn btn-primary w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
